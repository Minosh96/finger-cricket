name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the APK to a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo only contains lib/, test/ and the Firebase backend.
      # If you haven't committed an android/ folder, generate it here.
      - name: Generate Android project (if missing)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.melow.fingercricket --project-name finger_cricket .
          fi

      - name: Patch Android settings (minSdk 23, INTERNET, app name)
        run: |
          set -e
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] || continue
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = maxOf(23, flutter.minSdkVersion)/' "$f"
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion Math.max(23, flutter.minSdkVersion)/' "$f"
            grep -n "minSdk" "$f" || true
          done
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdk = maxOf(23, flutter.minSdkVersion)/minSdk = Math.max(23, flutter.minSdkVersion)/' android/app/build.gradle
          fi
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || \
            sed -i '0,/<manifest[^>]*>/s//&\n    <uses-permission android:name="android.permission.INTERNET"\/>/' "$M"
          sed -i 's/android:label="finger_cricket"/android:label="Finger Cricket"/' "$M"
          head -5 "$M"

      - name: Get packages
        run: flutter pub get

      - name: Analyze (informational)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Run rule tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Report Firebase status
        run: |
          if grep -q "PLACEHOLDER" lib/firebase_options.dart; then
            echo "::warning::Firebase not configured – this APK has Pass & Play only. See README Part B."
          else
            echo "Firebase configured – online play enabled."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: finger-cricket-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release (only for v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
